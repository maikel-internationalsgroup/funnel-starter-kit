name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # lowest version we support on the hosting

      - name: Lint PHP
        run: find src public tools templates -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Check config, translations and templates
        run: php tools/funnel.php check

      - name: Build preview (artifact export)
        run: php tools/funnel.php preview

      - uses: actions/upload-artifact@v4
        with:
          name: funnel-preview
          path: dist/preview.html
